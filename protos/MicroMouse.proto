#VRML_SIM R2025a utf8
PROTO MicroMouse [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation 0 1 0 0
]
{
Robot {
  translation IS translation
  rotation IS rotation
  controller "micromouse_controller"

  children [

    DEF BODY Shape {
      appearance PBRAppearance {
        baseColor 0.2 0.2 0.2
        roughness 0.5
        metalness 0
      }
      geometry Box {
        size 0.06 0.02 0.05
      }
    }

    DistanceSensor {
      name "front_sensor"
      translation 0.03 0.01 0
      rotation 0 1 0 0
      type "infra-red"
    }

    DistanceSensor {
      name "left_sensor"
      translation 0.02 0.01 0.025
      rotation 0 1 0 1.57
      type "infra-red"
    }

    DistanceSensor {
      name "right_sensor"
      translation 0.02 0.01 -0.025
      rotation 0 1 0 -1.57
      type "infra-red"
    }

    HingeJoint {
      jointParameters HingeJointParameters {
        axis 0 1 0
      }
      device [
        RotationalMotor {
          name "left_motor"
        }
        PositionSensor {
          name "left_encoder"
        }
      ]
      endPoint Solid {
        translation 0 0 -0.03
        children [
          Shape {
            geometry Cylinder {
              radius 0.01
              height 0.005
            }
          }
        ]
      }
    }

    HingeJoint {
      jointParameters HingeJointParameters {
        axis 0 1 0
      }
      device [
        RotationalMotor {
          name "right_motor"
        }
        PositionSensor {
          name "right_encoder"
        }
      ]
      endPoint Solid {
        translation 0 0 0.03
        children [
          Shape {
            geometry Cylinder {
              radius 0.01
              height 0.005
            }
          }
        ]
      }
    }

  ]
}
}